name: PR Acceptance

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Prettier Check
        run: bun run prettier --check . --ignore-unknown

      - name: Check Generated Schema
        run: bun run spec:check

      - name: Build Website
        run: bun run build

      - name: Bun Run
        run: bun test

      - name: Python Unit Tests
        run: |
          python -m pip install 'pytest>=8,<10' 'PyYAML>=6,<7' 'jsonschema>=4,<5'
          python -m pytest bin
